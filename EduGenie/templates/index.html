<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie · AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="brand-mark" aria-hidden="true">E</div>
      <div>
        <p class="eyebrow">AI LEARNING ASSISTANT</p>
        <h1>Learn smarter with <span>EduGenie</span></h1>
        <p class="subtitle">Ask questions, simplify concepts, generate quizzes, summarize notes, and build a learning path.</p>
      </div>
    </section>

    <section class="workspace" aria-label="EduGenie workspace">
      <div class="control-row">
        <label for="task">Choose a task</label>
        <select id="task" name="task">
          <option value="qa">Ask a Question</option>
          <option value="explain">Explain a Concept</option>
          <option value="quiz">Generate Quiz</option>
          <option value="summarize">Summarize Text</option>
          <option value="learn">Recommend Learning Path</option>
        </select>
      </div>

      <label for="userInput" id="inputLabel">What would you like to learn?</label>
      <textarea id="userInput" rows="9" placeholder="Example: Why is the Pacific Ocean the largest ocean?"></textarea>
      <div class="input-meta">
        <span id="hint">Enter a question and EduGenie will answer it clearly.</span>
        <span id="charCount">0 characters</span>
      </div>

      <button id="submitBtn" type="button">
        <span id="buttonText">Ask EduGenie</span>
        <span class="spinner" id="spinner" aria-hidden="true"></span>
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="resultCard" class="result-card hidden" aria-live="polite">
        <div class="result-header">
          <h2 id="resultTitle">Result</h2>
          <button id="copyBtn" class="secondary-btn" type="button">Copy</button>
        </div>
        <div id="result" class="result-content"></div>
      </section>
    </section>

    <footer>
      <span>EduGenie</span> · FastAPI + Google Gemini
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
